# A tool around C4 built on version 2 of the compiler's C API (C4/docs/tools/06-c4-api.md section 2b): c4-query opens a
# program and answers what the compiler knows of it - its diagnostics, what a name resolves to, the type of an
# expression, a declaration's references, a type's members. It is a workspace of its own, as a third party's tool is: it
# pins a toolchain, and depends = ["C4Api"] gives it that toolchain's C API. From this folder:
#   nuke build run -- tests/fixtures/ring diagnostics      nuke test (tests/: every query against the fixture program)
[workspace]
name = "c4-query"
toolchain = "dev"
default-project = "c4-query"
projects = ["tests"]

[project]
name = "c4-query"
kind = "executable"
language = "cpp"
description = "Queries a C4 program - diagnostics, names, types, references, members - through C4Api"
depends = ["C4Api"]
