title = "Find and fix reported bugs in an existing program"
category = "debug"
set = "tune2"
# 2: six bugs, two of them in parsing and grouping - every setup of either language fixed version 1's four.
version = 2
timeout_minutes = 45

[c4]
project = "invoice"
prompt = """
Users report problems with `invoice`, a small C4 program (a Nuke workspace) that totals orders from a CSV file. README.md has its pricing rules; `data/orders.csv` is an example.

- Customers who order exactly ten of an item say they did not get the bulk discount.
- Gold customers who order in bulk pay less than the rules say they should.
- Some totals are a cent off.
- It crashes on a file that has no orders.
- An order whose lines are not next to each other in the file is listed twice, each time with part of its total.
- Files saved from Excel are rejected with `error: line 2: bad price`.

Find and fix the causes, add a regression test for each, and build and test before you finish.
"""

[go]
project = "invoice"
prompt = """
Users report problems with `invoice`, a small Go program (package main in this module) that totals orders from a CSV file. README.md has its pricing rules; `data/orders.csv` is an example.

- Customers who order exactly ten of an item say they did not get the bulk discount.
- Gold customers who order in bulk pay less than the rules say they should.
- Some totals are a cent off.
- It crashes on a file that has no orders.
- An order whose lines are not next to each other in the file is listed twice, each time with part of its total.
- Files saved from Excel are rejected with `error: line 2: bad price`.

Find and fix the causes, add a regression test for each, and build and test before you finish.
"""

[[checks]]
name = "example"
args = ["{data}/orders.csv"]
stdout_file = "data/expected/orders.txt"

[[checks]]
name = "bulk-at-ten"
args = ["{data}/bulk10.csv"]
stdout_file = "data/expected/bulk10.txt"

[[checks]]
name = "gold-bulk"
args = ["{data}/goldbulk.csv"]
stdout_file = "data/expected/goldbulk.txt"

[[checks]]
name = "cents"
args = ["{data}/cents.csv"]
stdout_file = "data/expected/cents.txt"

[[checks]]
name = "no-orders"
args = ["{data}/empty.csv"]
stdout_file = "data/expected/empty.txt"

[[checks]]
name = "average-unchanged"
args = ["{data}/average.csv"]
stdout_file = "data/expected/average.txt"

[[checks]]
name = "missing-file-unchanged"
args = ["{data}/no-such.csv"]
exit = 1
stderr_contains = "error: cannot read"

[[checks]]
name = "excel-line-breaks"
args = ["{data}/excel.csv"]
stdout_file = "data/expected/excel.txt"

[[checks]]
name = "interleaved-orders"
args = ["{data}/interleaved.csv"]
stdout_file = "data/expected/interleaved.txt"
