title = "Port a C++ Markdown-to-HTML converter, with a small context window"
category = "longrun"
set = ["holdout", "holdout2"]
timeout_minutes = 75
max_steps = 250
context_window = 32768

[c4]
project = "mdhtml"
prompt = """
`cpp/` holds `mdhtml`, a C++ program that converts a Markdown file to HTML; `cpp/README.md` describes its rules. Port it to C4 in this Nuke workspace (`nuke.toml`, entry point `src/main.cf`): the same command line, exit codes and error messages, and exactly the same output for every input.

- Keep its structure: one C4 file pair (`.ch` and `.cf`) under `src/` for each C++ source pair, with the same functions and types, and `main` in `src/main.cf`.
- Port its unit tests (`cpp/tests/`) too, as C4 tests under `src/tests/`.
- Leave `cpp/` as it is.

Build and run the tests before you finish.
"""

[go]
project = "mdhtml"
prompt = """
`cpp/` holds `mdhtml`, a C++ program that converts a Markdown file to HTML; `cpp/README.md` describes its rules. Port it to Go, package main in this module (`go.mod`, `main.go`): the same command line, exit codes and error messages, and exactly the same output for every input.

- Keep its structure: one Go file for each C++ source pair (`text.go` for `text.h` and `text.cpp`, and so on), with the same functions and types, and `main` in `main.go`.
- Port its unit tests (`cpp/tests/`) too, as Go tests.
- Leave `cpp/` as it is.

Build and run the tests before you finish.
"""

[[checks]]
name = "headings"
args = ["{data}/headings.md"]
stdout_file = "data/expected/headings.html"

