<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IED mock console</title>
<style>
:root {
	--bg: #1e1e1e; --panel: #252526; --border: #3c3c3c; --text: #d4d4d4; --muted: #8a8a8a; --input: #2d2d2d;
	--ok: #4ec06b; --warn: #d7ba4a; --err: #f14c4c; --info: #3794ff;
	font: 12px/1.4 "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; }
header, form { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--border); }
input, select, button, textarea { font: inherit; color: var(--text); background: var(--input); border: 1px solid var(--border); padding: 3px 6px; }
button { cursor: pointer; }
button:hover { border-color: var(--muted); }
#status.ok { color: var(--ok); } #status.err { color: var(--err); } #status.wait { color: var(--warn); }
.grow { flex: 1 1 160px; min-width: 0; }
#log { flex: 1; overflow: auto; margin: 0; padding: 6px 8px; font: 12px/1.35 Consolas, "Cascadia Mono", monospace; white-space: pre-wrap; word-break: break-all; }
.in { color: var(--muted); } .res-err { color: var(--err); } .gap { color: var(--warn); } .snap { color: var(--info); }
.muted { color: var(--muted); }
</style>
</head>
<body>
<header>
	<strong>IED mock</strong>
	<span id="status" class="wait">offline</span>
	<span class="muted" id="ident"></span>
	<select id="device"><option>desktop</option><option>tablet</option><option>phone</option></select>
	<button id="connect">Connect (resume)</button>
	<button id="kill" title="Close the socket but keep cursors, then press Connect to resume">Drop socket</button>
	<button id="clear">Clear log</button>
</header>
<form id="subForm">
	<input id="topics" class="grow" value="server ws:w1 chat:c1 out:w1:build diag:w1" aria-label="topics">
	<button>Subscribe</button>
	<button type="button" id="unsub">Unsubscribe</button>
</form>
<form id="reqForm">
	<input id="method" value="chat.send" aria-label="method">
	<input id="params" class="grow" value='{"chatId":"c1","text":"how does the player move?"}' aria-label="params">
	<label><input type="checkbox" id="withOp" checked> opId</label>
	<button>Send request</button>
</form>
<pre id="log"></pre>
<script>
"use strict";
const $ = id => document.getElementById(id);
const store = {
	get(key, fallback) { try { return JSON.parse(sessionStorage.getItem(key)) ?? fallback; } catch { return fallback; } },
	set(key, value) { try { sessionStorage.setItem(key, JSON.stringify(value)); } catch { } }
};
const clientId = store.get("ied.clientId", "c-" + Math.random().toString(16).slice(2, 10));
store.set("ied.clientId", clientId);
const deviceId = "d-console";
let sock = null, nextId = 1;
let epoch = store.get("ied.epoch", null);
const cursors = store.get("ied.cursors", {});
$("ident").textContent = clientId;

function log(text, cls) {
	const line = document.createElement("div");
	line.textContent = text;
	if (cls) line.className = cls;
	const box = $("log");
	const atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 4;
	box.appendChild(line);
	while (box.childNodes.length > 800) box.removeChild(box.firstChild);
	if (atEnd) box.scrollTop = box.scrollHeight;
}
function status(text, cls) { $("status").textContent = text; $("status").className = cls; }
function send(frame) { log("> " + JSON.stringify(frame), "in"); sock.send(JSON.stringify(frame)); }

function connect() {
	if (sock) sock.close();
	status("connecting", "wait");
	sock = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
	sock.onopen = () => {
		const hello = { t: "hello", proto: 1, clientId, deviceId, deviceClass: $("device").value, deviceName: "mock console" };
		if (epoch && Object.keys(cursors).length) hello.resume = { sessionEpoch: epoch, cursors };
		send(hello);
	};
	sock.onmessage = event => onFrame(JSON.parse(event.data), event.data);
	sock.onclose = event => status("closed " + event.code + (event.reason ? " " + event.reason : ""), "err");
	sock.onerror = () => status("error", "err");
}

function onFrame(frame, raw) {
	if (frame.t === "welcome") {
		if (frame.sessionEpoch !== epoch) Object.keys(cursors).forEach(k => delete cursors[k]);
		epoch = frame.sessionEpoch;
		store.set("ied.epoch", epoch);
		status("connected " + epoch, "ok");
	}
	if (frame.t === "evt") {
		if (frame.seq <= (cursors[frame.topic] ?? -1)) { log("duplicate ignored " + frame.topic + "#" + frame.seq, "gap"); return; }
		cursors[frame.topic] = frame.seq;
	}
	if (frame.t === "snap") cursors[frame.topic] = frame.seq;
	if (frame.t === "gap") { delete cursors[frame.topic]; send({ t: "sub", id: nextId++, topics: [frame.topic] }); }
	store.set("ied.cursors", cursors);
	const cls = frame.t === "gap" ? "gap" : frame.t === "snap" ? "snap" : frame.t === "res" && !frame.ok ? "res-err" : "";
	log("< " + raw, cls);
}

$("connect").onclick = connect;
$("kill").onclick = () => { if (sock) { sock.onclose = null; sock.close(4000, "killed"); status("killed (state kept for resume)", "err"); } };
$("clear").onclick = () => { $("log").textContent = ""; };
$("subForm").onsubmit = event => {
	event.preventDefault();
	const topics = $("topics").value.split(/\s+/).filter(Boolean);
	const from = {};
	topics.forEach(t => { if (t in cursors) from[t] = cursors[t]; });
	send(Object.keys(from).length ? { t: "sub", id: nextId++, topics, from } : { t: "sub", id: nextId++, topics });
};
$("unsub").onclick = () => send({ t: "unsub", topics: $("topics").value.split(/\s+/).filter(Boolean) });
$("reqForm").onsubmit = event => {
	event.preventDefault();
	let params;
	try { params = JSON.parse($("params").value || "{}"); } catch (e) { log("params: " + e.message, "res-err"); return; }
	const frame = { t: "req", id: nextId++, method: $("method").value.trim(), params };
	if ($("withOp").checked) frame.opId = "op-" + Date.now().toString(36);
	send(frame);
};
setInterval(() => { if (sock && sock.readyState === 1) sock.send(JSON.stringify({ t: "ping", ts: Date.now() })); }, 20000);
connect();
</script>
</body>
</html>
