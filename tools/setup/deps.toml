# Downloaded dependencies: what setup.bat fetches, pinned and checksummed. Nothing here is committed to git;
# sources that are git repositories are submodules instead (.gitmodules). Bump a version by changing its url
# and sha256 together, then run `setup.bat --only <name> --force`.
#
# group: core   = needed to build the C4 compiler and run Nuke (always installed)
#        ied    = the IED web client's libraries (installed by default; --without ied skips them)
#        extras = optional, for later milestones (--with extras)

[packages.llvm]
group = "core"
version = "22.1.0"
description = "clang, lld and the LLVM headers and libraries the C4 compiler is built with and links"
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.0/clang+llvm-22.1.0-x86_64-pc-windows-msvc.tar.xz"
sha256 = "2dd6a6c990865f98766dec58cce1cbfba48e5affc0098e5b1fff96c2f1d23e81"
dest = "C4/Frost/vendor/Compiler"
strip = 1
probe = "bin/clang.exe"
share-with-worktrees = true          # git worktrees junction the main checkout's copy (4 GB)

[packages.monaco-editor]
group = "ied"
version = "0.57.0"
description = "the editor core (editor plugin)"
url = "https://registry.npmjs.org/monaco-editor/-/monaco-editor-0.57.0.tgz"
sha256 = "3ea1712fbacd3290cf4751007e3a5b57cc279767607812d4c3e57925fb0b05c2"
dest = "vendor/web/monaco-editor"
strip = 1
probe = "package.json"

