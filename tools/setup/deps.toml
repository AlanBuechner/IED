sha256 = "fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
dest = "vendor/pip"
format = "zip"
probe = "pip/__main__.py"

# Not an archive: pip installs the hash-pinned requirements file into dest (kind "pip"); it is reinstalled when that file
# changes.
[packages.searxng-packages]
group = "ied"
kind = "pip"
version = "for searxng d47cb96"
description = "SearXNG's Python packages and waitress, for the private Python (docs/29)"
requirements = "tools/setup/searxng-requirements.txt"
dest = "vendor/searxng-packages"
probe = "waitress/__init__.py"

