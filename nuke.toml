# This repository is a Nuke workspace (Nuke/README.md). C4/ holds the language: its compiler and tools are C++ projects
# built by the C/C++ plugin's driver (plugins/cpp/nuke) with the LLVM release setup.bat installs. Common commands:
#   nuke build            build the C4 compiler and tools, refresh the "dev" toolchain
#   nuke test             the unit tests (C4Testing, CoreTesting, ReflectionTesting, the server's and the CLI's)
#   nuke gates            every C4 test suite (run before calling compiler work done)
#   nuke install-c4       install the compiler as a numbered, immutable toolchain other workspaces can pin
#   nuke build ied-server the IED server (src/), with the "dev" toolchain; `nuke conformance` checks it (protocol + server checks)
#   nuke e2e              the web client against the mock and the real server (Playwright, tests/e2e)
#   nuke install-ied      install IED into %LOCALAPPDATA%\Programs\IED and the Start menu (`nuke install-ied dist`: optimized)
[workspace]
name = "IED"
toolchain = "dev"
default-project = "C4"
projects = ["C4", "C4/*", "plugins/cpp/libraries/*", "src", "cli", "launcher", "desktop", "tools/schema-check/c4", "plugins/gpu"]

# The LLVM release C++ compiles with (clang, lld, llvm-lib; setup.bat installs it). Its headers are system headers of
# every C++ compile, as the C4 compiler's sources and tools include them.
[languages.cpp]
llvm = "vendor/llvm"
system-includes = ["${cpp.llvm}/include"]

[commands.gates]
description = "Build the C4 compiler, then run every C4 test suite (unit, e2e, negative, isolated, runtime, script, tools, Bedrock)"
requires = ["build"]
projects = ["C4"]

[commands.install-c4]
description = "Build the C4 compiler and install it as a numbered toolchain (version from C4/C4Lib/src/Compiler/Version.h)"
requires = ["build"]
projects = ["C4"]
steps = [
	{ name = "image", run = ["${python}", "C4/MakeToolchain.py", "--config", "${config}", "--bin", "${bin.root}", "--out", "${int.root}/C4/toolchain"] },
	{ name = "install", run = ["${python}", "${nuke}", "toolchain", "install", "${int.root}/C4/toolchain"] },
]

[commands.conformance]
description = "Build the IED server, the CLI and the desktop app, then run the protocol v1 conformance suite (tools/conformance) and the server checks (tools/server-checks) against them"
requires = ["build"]
projects = ["ied-server", "ied", "ied-desktop", "schemacheck"]
steps = [
	{ name = "conformance", run = ["${python}", "-I", "tools/conformance/run_conformance.py", "--server", "${bin.root}/ied-server/ied-server.exe"] },
	{ name = "schema-crosscheck", run = ["${python}", "-I", "tools/schema-check/crosscheck.py", "${bin.root}/schemacheck/schemacheck.exe"] },
	{ name = "server-checks", run = ["${python}", "-I", "tools/server-checks/run_server_checks.py", "--server", "${bin.root}/ied-server/ied-server.exe", "--cli", "${bin.root}/ied/ied.exe", "--desktop", "${bin.root}/ied-desktop/ied-desktop.exe"] },
]

[commands.e2e]
description = "Build the IED server, then the web client end to end: lint, the in-browser unit tests and every shell scenario at 3 viewports on the mock and the real server (tests/e2e; needs Playwright, in the python on PATH when not in Nuke's)"
requires = ["build"]
projects = ["ied-server"]
steps = [
	{ name = "web-lint", run = ["${python}", "-I", "frontend/mocks/build.py", "lint"] },
	{ name = "mock-tests", run = ["${python}", "-I", "-m", "unittest", "discover", "-s", "tools/mock-server/tests", "-t", "tools/mock-server/tests"] },
	{ name = "e2e", run = ["${python}", "-I", "tests/e2e/run_e2e.py", "--server", "${bin.root}/ied-server/ied-server.exe"] },
]

[commands.install-ied]
description = 'Build the IED server, the CLI and the desktop app, install them with the web client and the plugins into %LOCALAPPDATA%\Programs\IED, and put IED in the Start menu (tools/install; words after -- go to install_ied.py: --to <folder>, --no-register)'
requires = ["build"]
projects = ["ied-server", "ied", "ied-desktop"]
steps = [
	{ name = "install", run = ["${python}", "-I", "tools/install/install_ied.py", "--bin", "${bin.root}", "${args}"] },
]
