# The C4 compiler (C4.exe), built by the C/C++ plugin's driver (plugins/cpp/nuke) with the LLVM release the workspace
# names, together with the tools the toolchain ships (C4LSP, C4DAP, CBind, C4Script: the executables and the DLL in
# `depends` only order the build). It ships the install layout C4.exe finds beside itself (D-56): the Bedrock default
# library, the runtime's sources, and the clang, lld-link and llvm-rc it compiles and links C4 programs with, with
# clang's own headers. A Development build also refreshes the "dev" toolchain in the shared store, so C4 workspaces
# pinned to toolchain = "dev" use the compiler built here.
[project]
name = "C4"
kind = "executable"
language = "cpp"
group = "C4"
description = "The C4 compiler"
depends = ["C4Lib", "Core", "Reflection", "ObjectDescription", "Profiling", "UnitTesting", "C4LSP", "C4DAP", "CBind", "C4Script"]
includes = ["${cpp.llvm}/include"]
defines = { NOMINMAX = "", WIN32_LEAN_AND_MEAN = "" }
links = ["kernel32.lib", "user32.lib", "comdlg32.lib", "shell32.lib", "bcrypt.lib", "ntdll.lib",
	"${cpp.llvm}/lib/LLVM*.lib", "!LLVM-C.lib", "${cpp.llvm}/lib/Remarks.lib", "${cpp.llvm}/lib/LTO.lib"]

[project.driver]
reflection = true

[[project.copy]]
from = "${cpp.llvm}/bin/LLVM-C.dll"

[[project.copy]]
from = "${cpp.llvm}/bin/libclang.dll"

[[project.copy]]
from = "${cpp.llvm}/bin/LTO.dll"

[[project.copy]]
from = "Bedrock"

[[project.copy]]
from = "C4Runtime"

[[project.copy]]
from = "${cpp.llvm}/bin/clang.exe"
to = "toolchain/bin/clang.exe"

[[project.copy]]
from = "${cpp.llvm}/bin/lld-link.exe"
to = "toolchain/bin/lld-link.exe"

[[project.copy]]
from = "${cpp.llvm}/bin/llvm-rc.exe"
to = "toolchain/bin/llvm-rc.exe"

[[project.copy]]
from = "${cpp.llvm}/lib/clang"
to = "toolchain/lib/clang"

[[project.steps]]
name = "dev-toolchain"
phase = "post-build"
configs = ["Development"]
description = "refresh the dev toolchain"
run = ["${python}", "MakeToolchain.py", "--config", "${config}", "--bin", "${bin.root}", "--out", "${toolchains}/c4/dev"]

# --- nuke gates: every suite the compiler must pass (docs/tools/05-test-suites.md) ---------------------------

[[project.steps]]
name = "unit-tests"
phase = "gates"
description = "C4Testing, CoreTesting and ReflectionTesting"
run = ["${python}", "${nuke}", "test", "C4Testing", "CoreTesting", "ReflectionTesting", "${config}"]

[[project.steps]]
name = "e2e"
phase = "gates"
run = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "assets/TestCode/RunTests.ps1"]

[[project.steps]]
name = "e2e-incremental"
phase = "gates"
run = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "assets/TestCode/RunTests.ps1", "-Incremental"]

[[project.steps]]
name = "negative"
phase = "gates"
run = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "assets/NegativeTest/RunTests.ps1"]

[[project.steps]]
name = "negative-O2"
phase = "gates"
run = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "assets/NegativeTest/RunTests.ps1", "-O2"]

[[project.steps]]
name = "isolated"
phase = "gates"
run = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "assets/IsolatedTest/RunTests.ps1"]

[[project.steps]]
name = "isolated-O2"
phase = "gates"
run = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "assets/IsolatedTest/RunTests.ps1", "-O2"]

[[project.steps]]
name = "runtime"
phase = "gates"
run = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "assets/RuntimeTest/RunTests.ps1"]

[[project.steps]]
name = "script"
phase = "gates"
run = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "assets/ScriptTest/RunTests.ps1"]

[[project.steps]]
name = "script-O2"
phase = "gates"
run = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "assets/ScriptTest/RunTests.ps1", "-O2"]

# Every case again with its host built -g: its scripts are DLLs with PDBs (docs/runtime/04 section 6.4).
[[project.steps]]
name = "script-debug"
phase = "gates"
run = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "assets/ScriptTest/RunTests.ps1", "-DebugScripts"]

[[project.steps]]
name = "script-debug-O2"
phase = "gates"
run = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "assets/ScriptTest/RunTests.ps1", "-DebugScripts", "-O2"]

# Every case again with its host built in partitions (D-81): the table, the inline bodies and the build id across them.
[[project.steps]]
name = "script-incremental-O2"
phase = "gates"
run = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "assets/ScriptTest/RunTests.ps1", "-Incremental", "-O2"]

[[project.steps]]
name = "tools"
phase = "gates"
run = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "assets/ToolsTest/RunTests.ps1"]

[[project.steps]]
name = "differential"
phase = "gates"
run = ["${python}", "assets/DifferentialTest/run.py"]

[[project.steps]]
name = "bedrock-compile"
phase = "gates"
run = ["${output}", "Bedrock/Tests", "-test", "-o", "assets/build-output/bedrock/BedrockTests.exe"]

[[project.steps]]
name = "bedrock"
phase = "gates"
run = ["assets/build-output/bedrock/BedrockTests.exe"]

[[project.steps]]
name = "gc-concurrent"
phase = "gates"
run = ["${python}", "assets/ConcurrentGcTest/run.py"]

[[project.steps]]
name = "bedrock-benchmark"
phase = "gates"
run = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "Benchmarks/bedrock/run-benchmark.ps1", "-Check"]
