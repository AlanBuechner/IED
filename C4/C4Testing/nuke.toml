# The compiler's unit tests (and the language server's and debug adapter's): nuke test C4Testing --filter "Lexer.*".
# It depends on C4 so the compiler the debug adapter tests launch is built too. ntdll: LLVMSupport (RtlGetLastNtStatus);
# dbghelp: the debug adapter; shell32: its command-line test. The codegen tests include the LLVM headers directly.
[project]
name = "C4Testing"
kind = "executable"
language = "cpp"
group = "C4"
description = "The C4 compiler, language server and debug adapter unit tests"
depends = ["Core", "UnitTesting", "C4Lib", "ObjectDescription", "C4Protocol", "C4LSPLib", "C4DAPLib", "C4Api", "C4"]
includes = ["${cpp.llvm}/include", "../C4Api/src"]
defines = { NOMINMAX = "", WIN32_LEAN_AND_MEAN = "" }
tests = true

# C4Api's import library (C4Api.so on Linux): the API tests call the library a tool would ship (a second copy of the
# compiler, as a tool has), copied beside the tests.
[project.system.windows]
links = ["ntdll.lib", "dbghelp.lib", "shell32.lib", "${bin.root}/C4Api/C4Api.lib"]

[project.system.linux]
links = ["${bin.root}/C4Api/C4Api.so"]

[[project.copy]]
from = "${bin.root}/C4Api/C4Api.dll"
systems = ["windows"]

[[project.copy]]
from = "${bin.root}/C4Api/C4Api.so"
systems = ["linux"]

[project.driver]
reflection = true
