# ied-desktop: IED's desktop app (docs/27): a window per IED view, the web client in WebView2 (the Edge engine Windows
# ships), the user's ied-server started when none runs. The WebView2 SDK is the pinned `webview2` download of
# tools/setup/deps.toml; its static loader is linked in, and the icon, version and manifest are resources of the exe,
# so the exe is all that ships.
[project]
name = "ied-desktop"
kind = "executable"
subsystem = "windows"
description = "IED's desktop app: the web client in a native WebView2 window, starting the user's ied-server when needed"
depends = ["launcher"]
sources = ["."]
includes = ["../vendor/webview2/build/native/include"]
links = ["user32", "gdi32", "ole32", "dwmapi", "advapi32", "shell32", "version", "${workspace.dir}/vendor/webview2/build/native/x64/WebView2LoaderStatic.lib"]
compiler-args = ["-l", "${int}/ied.res"]
working-dir = ".."

[[project.steps]]
name = "resources"
phase = "pre-build"
description = "Compile the icon, version and manifest (resources/ied.rc) into ied.res"
run = ["${toolchain.dir}/toolchain/bin/llvm-rc.exe", "-fo", "${int}/ied.res", "resources/ied.rc"]
inputs = ["resources/ied.rc", "resources/ied.ico", "resources/ied-desktop.manifest"]
outputs = ["${int}/ied.res"]
